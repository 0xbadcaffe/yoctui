[package]
name = "yoctui-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
yoctui-utils = { version = "0.1.354", path = "../yoctui-utils" }
libc.workspace = true

[dev-dependencies]
crossterm.workspace = true
ratatui.workspace = true
yoctui-app = { version = "0.1.354", path = "../yoctui-app" }
yoctui-model = { version = "0.1.354", path = "../yoctui-model" }
yoctui-ui = { version = "0.1.354", path = "../yoctui-ui" }

# Reuse the exact renderer workload without building the CLI binary as a
# prerequisite of every benchmark/profile invocation. This crate is private.
[[bench]]
name = "workbench_profile"
path = "../yoctui-cli/benches/workbench_profile.rs"
harness = false
