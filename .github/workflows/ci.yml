name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: "yoctui-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
jobs:
  compatibility-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 -m pip install pytest
      - name: Run deterministic release compatibility gates
        run: ./scripts/test-release-compatibility.sh
      - name: Validate compatibility CI contract
        run: ./scripts/check-ci.sh
  test:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:26.04
      options: --init
    steps:
      - name: Install pinned raster host prerequisites
        run: |
          apt-get update
          apt-get install -y git curl build-essential pkg-config python3-dev python3-venv libcairo2-dev fontconfig fonts-dejavu-core
          python3 -m venv /opt/yoctui-ci
          echo /opt/yoctui-ci/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Trust the mounted checkout in the test container
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - run: python3 -m pip install ruff mypy pytest pytest-cov pycairo==1.27.0
      - run: python3 -m unittest scripts/test_version_bump.py
      - run: python3 scripts/check-version-bump.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: ./scripts/test-terminal.sh
      - run: ./scripts/test-stress.sh
      - run: ./scripts/test-cli.sh
      - run: ./scripts/check-docs.sh
      - run: python3 -m unittest discover bridge/tests
      - run: ruff check crates/yoctui-bitbake/bridge bridge/tests
      - run: ruff format --check crates/yoctui-bitbake/bridge bridge/tests
      - run: mypy crates/yoctui-bitbake/bridge bridge/tests
      - run: pytest bridge/tests --cov=crates/yoctui-bitbake/bridge --cov-report=term-missing --cov-fail-under=75
  release-quality:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --locked -p yoctui
      - name: Run PTY/keymap/flow/snapshot/performance gates
        run: |
          ./scripts/test-tui-pty.sh
          ./scripts/test-tui-keymap.sh
          ./scripts/test-tui-flow.sh
          ./scripts/test-tui-snapshots.sh
          ./scripts/test-tui-performance.sh
      - name: Run utility and embedded-shell gates
        run: |
          ./scripts/verify-utility-coverage.sh
          ./scripts/test-embedded-shell.sh
      - name: Upload release-quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoctui-release-quality-${{ github.sha }}
          path: artifacts/release-quality/
          if-no-files-found: ignore
  performance-fast:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build deterministic performance fixture binary
        run: cargo build --locked -p yoctui
      - name: Run fast low-overhead and saturation gates
        run: |
          set -o pipefail
          mkdir -p artifacts/performance/ci
          ./scripts/verify-performance-ci-fast.sh 2>&1 | tee artifacts/performance/ci/fast.log
      - name: Upload fast performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoctui-performance-fast-${{ github.sha }}
          path: artifacts/performance/ci/
          if-no-files-found: error
  performance-scheduled:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build release performance binary
        run: cargo build --release --locked -p yoctui --all-features
      - name: Validate retained profiles and real-build evidence
        run: |
          set -o pipefail
          mkdir -p artifacts/performance/ci
          ./scripts/verify-performance.sh --real-poky-evidence 2>&1 | tee artifacts/performance/ci/evidence.log
      - name: Run controlled steady-state CPU gate
        run: ./scripts/verify-low-overhead.sh
      - name: Run 30-minute memory endurance
        run: |
          ./scripts/measure-bounded-memory.py \
            --binary target/release/yoctui \
            --warmup-seconds 10 \
            --sample-seconds 1800 \
            --rate 4000 \
            --output artifacts/performance/ci/memory-endurance.json
      - name: Upload scheduled performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoctui-performance-scheduled-${{ github.sha }}
          path: artifacts/performance/ci/
          if-no-files-found: error
  performance-live-poky:
    if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.YOCTUI_LIVE_PERFORMANCE == '1' }}
    runs-on: [self-hosted, linux, yoctui-poky]
    timeout-minutes: 90
    env:
      YOCTUI_PERF_BUILD_DIR: ${{ vars.YOCTUI_PERF_BUILD_DIR }}
      YOCTUI_PERF_POKY_ROOT: ${{ vars.YOCTUI_PERF_POKY_ROOT }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release performance binary
        run: cargo build --release --locked -p yoctui --all-features
      - name: Capture fresh real-Poky saturation evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$YOCTUI_PERF_BUILD_DIR"
          test -n "$YOCTUI_PERF_POKY_ROOT"
          source "$YOCTUI_PERF_POKY_ROOT/oe-init-build-env" "$YOCTUI_PERF_BUILD_DIR"
          cd "$GITHUB_WORKSPACE"
          mkdir -p artifacts/performance/ci
          ./scripts/capture-real-poky-performance.py \
            --binary target/release/yoctui \
            --build-dir "$YOCTUI_PERF_BUILD_DIR" \
            --poky-root "$YOCTUI_PERF_POKY_ROOT" \
            --target linux-yocto \
            --task compile \
            --preclean \
            --wait-for-task linux-yocto:do_compile \
            --warmup-seconds 10 \
            --seconds 120 \
            --output artifacts/performance/ci/real-poky.json
      - name: Upload live Poky performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoctui-performance-real-poky-${{ github.sha }}
          path: artifacts/performance/ci/
          if-no-files-found: error
  compatibility-live:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: [older, latest]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Yocto host prerequisites
        run: sudo apt-get update && sudo apt-get install -y chrpath diffstat gawk lz4
      - name: Build Yoctui
        run: cargo build --locked -p yoctui
      - name: Run fresh official compatibility role
        env:
          YOCTUI_LIVE_COMPATIBILITY: '1'
          YOCTUI_LIVE_TIMEOUT: '300'
          YOCTUI_COMPAT_ARTIFACT_DIR: artifacts/compatibility/${{ matrix.role }}
        run: ./scripts/test-compatibility-matrix.sh --live ${{ matrix.role }}
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yoctui-compatibility-${{ matrix.role }}-${{ github.sha }}
          path: artifacts/compatibility/${{ matrix.role }}/
          if-no-files-found: error
