[workspace]
members = [
  "crates/yoctui-model", "crates/yoctui-protocol", "crates/yoctui-app",
  "crates/yoctui-bitbake", "crates/yoctui-ui", "crates/yoctui-cli"
  , "crates/yoctui-e2e", "crates/yoctui-shell"
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.36"
edition = "2024"
license = "MIT"
authors = ["Roy Cohen <roy@0xbadcaffe.dev>"]
repository = "https://github.com/0xbadcaffe/yoctui"
homepage = "https://github.com/0xbadcaffe/yoctui"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
throbber-widgets-tui = { version = "0.11.1", default-features = false, features = ["std"] }
tui-piechart = { version = "=1.0.2", default-features = false }
tui-term = { version = "=0.3.4", default-features = false }
tui-tree-widget = { version = "=0.24.1", default-features = false }
tokio = { version = "1.49", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal", "fs"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"
libc = "0.2"
proptest = "1.9"
vt100 = "0.16.2"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
