# Production UI scenarios and executable acceptance checks.
schema_version = 1
logical_columns = 160
logical_rows = 50
theme = "dark-pro"
exact_pixel_golden = false

[[scenario]]
id = "idle-dashboard"
workspace = "Dashboard"
state = "daemon current; BitBake idle"
real_yoctui_golden = "crates/yoctui-ui/tests/golden/concept-idle-dashboard-160x50.cells"
real_yoctui_capture = "crates/yoctui-ui/tests/golden/concept-idle-dashboard-160x50.txt"
real_yoctui_anchors = ["Build Overview", "build not started · 0%", "Job History", "Resource Telemetry", "Daemon Status : Connected", "Local 19:28"]
required_features = [
  { id = "next-action", description = "Capability-aware next action", fixture_anchors = ["Next Action", "Build image [Alt+b]"] },
  { id = "persistent-shell", description = "Persistent shell and idle lifecycle", fixture_anchors = ["Build Overview", "Daemon Status : Connected"] },
  { id = "build-cockpit", description = "Idle build overview and explicit current task", fixture_anchors = ["build not started · 0%", "Current Task  : none"] },
  { id = "job-history", description = "Recent and active daemon-owned work", fixture_anchors = ["Job History", "Succeeded"] },
  { id = "resource-state", description = "Typed telemetry and unavailable cache state", fixture_anchors = ["Resource Telemetry", "CPU Usage", "18%"] },
  { id = "discoverability", description = "Navigator and application-menu routes remain visible", fixture_anchors = ["Enter open", "F12 Menu"] },
]
