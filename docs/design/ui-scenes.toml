# Production UI scenarios and executable acceptance checks.
schema_version = 1
logical_columns = 160
logical_rows = 50
theme = "dark-pro"
exact_pixel_golden = false

[[scenario]]
id = "idle-dashboard"
workspace = "Dashboard"
state = "daemon current; BitBake idle"
real_yoctui_golden = "crates/yoctui-ui/tests/golden/concept-idle-dashboard-160x50.cells"
